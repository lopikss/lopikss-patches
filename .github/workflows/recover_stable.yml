name: Recover prepared stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-if-missing:
    name: Publish existing v1.0.0 tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Recover release only when missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Stable release already exists; nothing to do."
            exit 0
          fi
          git rev-parse -q --verify "refs/tags/v1.0.0" >/dev/null
          grep -q '^version = 1.0.0$' gradle.properties
          ./gradlew :patches:buildAndroid --no-daemon
          test -f patches/build/libs/patches-1.0.0.mpp
          gh release create v1.0.0 patches/build/libs/patches-1.0.0.mpp \
            --title "Lopikss Patches v1.0.0" \
            --notes-file CHANGELOG.md \
            --latest
