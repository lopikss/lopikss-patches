name: Validate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  compile:
    name: Verify Morphe bundle compiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check whitespace errors
        run: git show --format= --check HEAD
      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Inspect original XP Hero 26.2.0 ARM64 (diagnostics only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'investigate/xp-hero-26-2-return-20261022'
        run: |
          python3 -m pip install --quiet capstone
          curl --location --fail --show-error --silent --retry 2 --connect-timeout 30 --max-time 330 \
            --user-agent 'Mozilla/5.0' \
            'https://d.apkpure.net/b/XAPK/io.supercent.weaponrpg?nc=arm64-v8a&sv=24&versionCode=79' \
            --output /tmp/xp-hero-262.xapk
          python3 scripts/diagnose_xp_hero_262.py
