name: "✨ Feature request"
description: "Suggest an improvement or a new diagnostic"
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        Please describe the app, version, and what you want to understand or improve.
  - type: input
    id: app
    attributes:
      label: App and version
      placeholder: "XP Hero 26.2.0"
  - type: textarea
    id: proposal
    attributes:
      label: What should be improved?
      description: "Explain the goal, relevant behavior, and useful references."
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: How could we verify it works?
      description: "A reproducible test is preferable to an unsupported claim."
